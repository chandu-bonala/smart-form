services:
  - type: web
    name: smartform-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install -r app/requirements.txt
    preDeployCommand: python scripts/prepare_database.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    disk:
      name: smartform-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartform-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: GOOGLE_CLIENT_IDS
        sync: false

  - type: web
    name: smartform-web
    runtime: static
    rootDir: SmartForm
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false

databases:
  - name: smartform-db
    databaseName: smartform
    user: smartform
    region: singapore
    plan: 256mb
    postgresMajorVersion: "16"
